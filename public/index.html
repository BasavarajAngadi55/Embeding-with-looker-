<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 20px 30px;
      margin: 20px auto 0;
      border-radius: 10px;
      max-width: 900px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    #dashboard {
      width: 100%;
      height: 90vh;
      border: 0;
      display: block;
      margin-top: 16px;
    }
    .error {
      color: #b00020;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Web App</h1>
    <p>Status: <span id="app-status">Checking backend connection...</span></p>
  </div>
  <iframe id="dashboard" title="Looker dashboard"></iframe>
  <p id="embed-error" class="error"></p>

  <script>
    fetch('/api/status')
      .then((res) => res.json())
      .then((data) => {
        document.getElementById('app-status').innerText = data.status;
      })
      .catch(() => {
        document.getElementById('app-status').innerText = 'Backend disconnected';
      });

    fetch('/api/looker-embed')
      .then((res) => {
        if (!res.ok) {
          throw new Error('Embed API failed');
        }
        return res.json();
      })
      .then((data) => {
        document.getElementById('dashboard').src = data.url;
      })
      .catch(() => {
        document.getElementById('embed-error').innerText =
          'Could not load the Looker dashboard.';
      });
  </script>
</body>
</html>
