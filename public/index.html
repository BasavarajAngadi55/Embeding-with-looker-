<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      text-align: center;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .status {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Welcome to My Web App</h1>
    <p>Status: <span id="app-status">Checking backend connection...</span></p>
  </div>

  <script>
    // Call our backend endpoint to verify server connection
    fetch('/api/status')
      .then(res => res.json())
      .then(data => {
        document.getElementById('app-status').innerText = data.status;
      })
      .catch(err => {
        document.getElementById('app-status').innerText = 'Backend disconnected';
      });
  </script>

</body>
</html>
